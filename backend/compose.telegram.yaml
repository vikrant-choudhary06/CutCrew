services:
  telegram-bot-api:
    build:
      context: ./telegram-bot-api
    image: cutcrew-telegram-bot-api:phase0
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:?Set TELEGRAM_API_ID in backend/.env}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?Set TELEGRAM_API_HASH in backend/.env}
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - telegram_bot_api_data:/var/lib/telegram-bot-api
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  telegram_bot_api_data:
