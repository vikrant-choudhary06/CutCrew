services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: cutcrew
      POSTGRES_USER: cutcrew
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell or backend/.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cutcrew -d cutcrew"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
