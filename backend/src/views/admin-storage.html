<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Telegram storage</title>
<style>
body{background:#111821;color:#e5e9ef;font:15px system-ui;max-width:1150px;margin:32px auto;padding:16px}
h1{font-size:26px;margin:8px 0}h2{font-size:18px;margin:0 0 12px}a{color:#a7c9ef}
section{border:1px solid #344152;border-radius:12px;padding:18px;margin:18px 0}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.card{background:#182330;border:1px solid #2c3a4b;border-radius:10px;padding:12px}.card b{display:block;font-size:20px;margin-top:4px}
.muted{color:#97a6b8;font-size:13px}#status{color:#d5b994;min-height:20px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px;border-bottom:1px solid #2a3646;vertical-align:top}
tbody tr.row{cursor:pointer}tbody tr.row:hover{background:#1b2735}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;background:#2a3646}
.ready{background:#1f5133}.failed{background:#6b2630}.unavailable{background:#6b4a1f}.superseded{background:#333d4a;color:#aab4c0}
.uploading,.verifying,.preparing,.validating,.pending{background:#24456b}
button,input,select{font:inherit;padding:8px 10px;background:#202e3d;color:inherit;border:1px solid #465265;border-radius:6px}button{cursor:pointer;margin:4px 4px 4px 0}
button:disabled{opacity:.5;cursor:wait}pre{white-space:pre-wrap;color:#b9c6d6;font-size:13px;margin:8px 0 0}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
@media (max-width:700px){.hide-sm{display:none}}
</style>
<a href="/admin">← Dashboard</a> · <a href="/admin/tools">Catalogue and provider health</a>
<h1>Telegram video storage</h1>
<p id="status" role="status"></p>

<section><h2>Status</h2><div class="cards" id="statusCards"></div><p class="muted" id="hint"></p></section>
<section><h2>Monitoring <span class="muted">(this server process, last 24 h; resets on restart)</span></h2><div class="cards" id="monitorCards"></div></section>

<section><h2>Imports</h2>
<form class="filters" id="filters"><select id="state" aria-label="State"><option value="">All states</option>
<option>ready</option><option>failed</option><option>unavailable</option><option>uploading</option><option>verifying</option><option>preparing</option><option>validating</option><option>pending</option><option>superseded</option></select>
<input id="q" placeholder="IMDb ID or title" maxlength="100" aria-label="Search"><button>Filter</button><button type="button" id="refresh">Refresh</button></form>
<table><thead><tr><th>Title</th><th>Version</th><th>State</th><th class="hide-sm">Size</th><th class="hide-sm">Parts</th><th class="hide-sm">Checked</th><th>Import job</th></tr></thead><tbody id="assets"><tr><td colspan="7">Loading…</td></tr></tbody></table>
</section>

<section id="detail" hidden><h2 id="detailTitle"></h2><div id="detailInfo" class="muted"></div>
<div id="actions"></div><pre id="actionResult"></pre>
<h3>Parts</h3><table><thead><tr><th>#</th><th>Offset</th><th>Size</th><th>State</th><th>Telegram message</th><th class="hide-sm">Verified</th></tr></thead><tbody id="parts"></tbody></table>
<h3>Import job</h3><pre id="job"></pre></section>

<script>
const $=s=>document.querySelector(s);
const status=$('#status');
const mb=b=>b==null?'—':b>=1e9?(b/1e9).toFixed(2)+' GB':(b/1e6).toFixed(1)+' MB';
const when=v=>v?new Date(v).toLocaleString():'—';
function el(tag,text,cls){const e=document.createElement(tag);if(text!=null)e.textContent=String(text);if(cls)e.className=cls;return e}
function card(label,value,sub){const c=el('div',null,'card');c.append(el('span',label,'muted'),el('b',value??'—'));if(sub)c.append(el('span',sub,'muted'));return c}
async function api(path,options={}){const r=await fetch('/api/admin/storage'+path,options);const body=await r.json().catch(()=>({}));if(!r.ok)throw new Error(body.error||'Request failed ('+r.status+')');return body}
async function post(path,body){return api(path,{method:'POST',headers:{'Content-Type':'application/json','X-CutCrew-Admin':'1'},body:JSON.stringify(body||{})})}

async function summary(){
  try{const s=await api('/summary');const sw=s.switch,c=s.counts||{},a=c.assets||{},j=c.jobs||{},m=s.monitoring;
    $('#statusCards').replaceChildren(
      card('Playback switch',sw.enabled?'ON':'OFF',sw.enabled?'Play prefers stored videos':(sw.requested?'Requested but settings invalid: '+[...sw.missing,...sw.errors].join(', '):'TELEGRAM_STORAGE_ENABLED=false')),
      card('Local Telegram server',s.telegram.localBotApiReachable?'Reachable':'Not running','Needed for imports'),
      card('Ready videos',a.ready||0,mb(c.readyBytes)+' stored'),
      card('Failed / unavailable',(a.failed||0)+' / '+(a.unavailable||0)),
      card('In progress',(a.pending||0)+(a.validating||0)+(a.preparing||0)+(a.uploading||0)+(a.verifying||0)),
      card('Import jobs queued / failed',(j.queued||0)+' / '+(j.failed||0),(j.running||0)+' running'));
    $('#hint').textContent=s.importHint;
    $('#monitorCards').replaceChildren(
      card('Stream requests',m.requests.total,m.requests.ok+' ok · '+m.requests.aborted+' left · '+Object.values(m.requests.errors).reduce((x,y)=>x+y,0)+' errors'),
      card('First byte p50 / p95',m.firstByteMs.p50==null?'—':m.firstByteMs.p50+' / '+m.firstByteMs.p95+' ms'),
      card('Delivery speed (p50)',m.deliveryMbps.p50==null?'—':m.deliveryMbps.p50+' Mbps',m.deliveredMB+' MB delivered'),
      card('Player startup p50',m.player.startupMs.p50==null?'—':m.player.startupMs.p50+' ms',m.player.sessions+' sessions'),
      card('Stalls',m.player.stalls,m.player.stallsPerHour==null?'no playback yet':m.player.stallsPerHour+' per hour · '+m.player.playedMinutes+' min played'),
      card('Cache',m.cache?m.cache.usedMB+' / '+m.cache.maxMB+' MB':'not started',m.cache&&m.cache.hitRate!=null?'hit rate '+Math.round(m.cache.hitRate*100)+'%':''),
      card('Telegram downloads',m.telegram?m.telegram.fetchedMB+' MB':'not started',m.telegram?m.telegram.retries+' retries · '+m.telegram.integrityRefetches+' refetches · '+m.telegram.missingPartsReported+' missing parts':''));
    const errors=Object.entries(m.requests.errors);if(errors.length)$('#monitorCards').append(card('Stream errors',errors.map(([k,v])=>k+' ×'+v).join(', ')));
  }catch(e){status.textContent='Summary unavailable: '+e.message}
}

async function list(){
  const params=new URLSearchParams();if($('#state').value)params.set('state',$('#state').value);if($('#q').value.trim())params.set('q',$('#q').value.trim());
  const body=$('#assets');
  try{const {data}=await api('/assets?'+params);body.replaceChildren();
    if(!data.length){const tr=el('tr');const td=el('td','No imports match.');td.colSpan=7;tr.append(td);body.append(tr);return}
    for(const a of data){const tr=el('tr',null,'row');tr.tabIndex=0;
      const title=el('td');title.append(el('div',a.title||a.imdbId),el('span',a.imdbId+(a.season!=null?' · S'+a.season+'E'+a.episode:''),'muted'));
      const version=el('td',[a.quality,a.edition!=='original'?a.edition:null,(a.audioLanguages||[]).join('+')].filter(Boolean).join(' · ')+(a.isDefault?' · default':''));
      const st=el('td');st.append(el('span',a.state,'badge '+a.state));if(a.failureReason)st.append(el('div',a.failureReason,'muted'));
      const job=el('td',a.job?a.job.status+' · '+a.job.stage+' · '+a.job.attempts+'/'+a.job.maxAttempts+(a.job.errorCategory?' · '+a.job.errorCategory:''):'—');
      tr.append(title,version,st,el('td',mb(a.totalSize),'hide-sm'),el('td',a.partCount??'—','hide-sm'),el('td',when(a.lastValidatedAt),'hide-sm'),job);
      tr.onclick=()=>detail(a.id);tr.onkeydown=e=>{if(e.key==='Enter')detail(a.id)};body.append(tr)}
  }catch(e){status.textContent='List unavailable: '+e.message}
}

async function detail(id,keepResult=false){
  try{const d=await api('/assets/'+id),a=d.asset;$('#detail').hidden=false;
    $('#detailTitle').textContent=(a.title||a.imdbId)+' — '+a.quality+' ('+a.state+')';
    $('#detailInfo').textContent=['Upload ID '+a.id,a.imdbId+(a.season!=null?' S'+a.season+'E'+a.episode:''),a.video,a.audioCodec,a.durationSeconds?Math.round(a.durationSeconds/60)+' min':null,mb(a.totalSize),a.transcoded?'transcoded':'original encode','ready '+when(a.readyAt),'checked '+when(a.lastValidatedAt)].filter(Boolean).join(' · ');
    const actions=$('#actions');actions.replaceChildren();if(!keepResult)$('#actionResult').textContent='';
    const add=(label,path,body,confirmText)=>{const b=el('button',label);b.onclick=async()=>{if(confirmText&&!confirm(confirmText))return;
      actions.querySelectorAll('button').forEach(x=>x.disabled=true);$('#actionResult').textContent=label+'…';
      try{const r=await post('/assets/'+id+'/'+path,body);$('#actionResult').textContent=JSON.stringify(r.result,null,2)}catch(e){$('#actionResult').textContent='Failed: '+e.message}
      actions.querySelectorAll('button').forEach(x=>x.disabled=false);summary();list();setTimeout(()=>detail(id,true),300)};actions.append(b)};
    if(['ready','unavailable'].includes(a.state)){add('Quick verify','verify',{mode:'quick'});add('Deep verify (re-read every byte)','verify',{mode:'deep'},'Deep verify downloads the whole video from Telegram ('+mb(a.totalSize)+'). Continue?')}
    if(a.state==='ready'&&!a.isDefault)add('Make default version','default');
    if(a.state==='ready')add('Take out of playback','unavailable',null,'Viewers will stop getting this stored copy (providers are used instead). Continue?');
    if(a.state==='unavailable')add('Restore to playback','restore',{mode:'quick'},'Check all parts and put this copy back into playback?');
    if(d.job&&['failed','queued'].includes(d.job.status)&&!['ready','unavailable','superseded'].includes(a.state))add('Retry import','retry');
    const parts=$('#parts');parts.replaceChildren();
    for(const p of d.parts){const tr=el('tr');const link=el('td');if(p.messageLink){const l=el('a','Open in Telegram');l.href=p.messageLink;l.target='_blank';l.rel='noopener';link.append(l)}else link.textContent='—';
      const st=el('td');st.append(el('span',p.state,'badge '+(p.state==='verified'?'ready':p.state==='missing'?'failed':'')));
      tr.append(el('td',p.part),el('td',p.offset.toLocaleString()),el('td',mb(p.size)),st,link,el('td',when(p.verifiedAt),'hide-sm'));parts.append(tr)}
    $('#job').textContent=d.job?JSON.stringify(d.job,null,2):'No import job.';
    if(!keepResult)$('#detail').scrollIntoView({behavior:'smooth',block:'start'});
  }catch(e){status.textContent='Details unavailable: '+e.message}
}

$('#filters').onsubmit=e=>{e.preventDefault();list()};
$('#refresh').onclick=()=>{summary();list()};
summary();list();setInterval(summary,30000);
</script>
