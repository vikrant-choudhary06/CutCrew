<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CutCrew administration</title><style>body{background:#111821;color:#e5e9ef;font:15px system-ui;max-width:1000px;margin:40px auto;padding:20px}h1{font-size:26px}section{border:1px solid #344152;border-radius:12px;padding:22px;margin:24px 0}button,input,textarea{font:inherit;padding:10px;background:#202e3d;color:inherit;border:1px solid #465265;border-radius:6px}button{cursor:pointer;margin:6px}label{display:block;margin:15px 0}input,textarea{display:block;width:min(90%,650px);margin-top:6px}pre{overflow:auto;white-space:pre-wrap;color:#b9c6d6}a{color:#a7c9ef}li{margin:8px 0}#status{color:#d5b994}</style><h1>CutCrew administration</h1><a href="/admin">← Dashboard</a> · <a href="/admin/storage">Telegram video storage →</a><p id="status" role="status"></p><section><h2>Provider and server health</h2><button id="refresh">Refresh health</button><pre id="health">Loading…</pre><p>Provider observations reflect source resolution in this server process, not continuous upstream availability.</p></section><section><h2>Catalogue</h2><form id="search"><label>Find a title<input id="query" maxlength="150"></label><button>Search</button></form><ul id="titles"></ul><form id="edit" hidden><h3 id="selected"></h3><label>Title<input id="title" required maxlength="300"></label><label>Updated synopsis (optional)<textarea id="plot" maxlength="9999"></textarea></label><label>Genres (optional, comma separated)<input id="genres" maxlength="1000"></label><button>Save changes</button></form></section><script>
let selected;
const status=document.querySelector('#status');
async function api(path,options){const response=await fetch('/api/admin'+path,options);const body=await response.json();if(!response.ok)throw Error(body.message||body.error||'Request failed');return body;}
async function health(){try{const data=await api('/health');document.querySelector('#health').textContent=JSON.stringify(data,null,2);const alerts=data.weeklySourceCheck?.alerts||[];let box=document.querySelector('#source-alerts');if(!box){box=document.createElement('div');box.id='source-alerts';box.setAttribute('role','alert');box.style.cssText='background:#5c1d1d;border:1px solid #c0392b;color:#fff;padding:12px 16px;border-radius:8px;margin:12px 0';document.querySelector('#health').before(box);}box.hidden=!alerts.length;box.textContent=alerts.length?'Playback sources switched off: '+alerts.join(' · '):'';}catch(error){status.textContent=error.message;}}
document.querySelector('#refresh').onclick=health;
document.querySelector('#search').onsubmit=async event=>{event.preventDefault();try{const body=await api('/catalogue?q='+encodeURIComponent(document.querySelector('#query').value));const list=document.querySelector('#titles');list.replaceChildren();for(const item of body.data){const li=document.createElement('li'),button=document.createElement('button');button.textContent=item.title+' · '+item.imdb_id;button.onclick=()=>{selected=item.imdb_id;document.querySelector('#selected').textContent=item.imdb_id;document.querySelector('#title').value=item.title;document.querySelector('#plot').value='';document.querySelector('#genres').value='';document.querySelector('#edit').hidden=false;};li.append(button);list.append(li);}status.textContent=body.data.length+' titles found';}catch(error){status.textContent=error.message;}};
document.querySelector('#edit').onsubmit=async event=>{event.preventDefault();const patch={title:document.querySelector('#title').value};const plot=document.querySelector('#plot').value,genres=document.querySelector('#genres').value;if(plot.trim())patch.plot=plot;if(genres.trim())patch.genres=genres.split(',').map(x=>x.trim()).filter(Boolean);try{await api('/catalogue/'+selected,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(patch)});status.textContent='Changes saved';}catch(error){status.textContent=error.message;}};
health();
</script></html>
