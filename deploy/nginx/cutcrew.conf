# Host Nginx for CutCrew. Copy to /etc/nginx/sites-available/cutcrew and link
# into sites-enabled. Certbot adds the HTTPS (443) blocks and redirects.
#   web.cutcrew.click -> website (frontend container, which also proxies /api)
#   cutcrew.click    -> landing page with download buttons (main/); www redirects to it
#   ccapi.cutcrew.click   -> backend API
#   ccadmin.cutcrew.click -> admin panel (static files from adminpannel/, /api to the backend)
#   imdbapi.cutcrew.click -> IMDb metadata API
# Video is streamed through these proxies: no buffering, long timeouts.

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 80;
  listen [::]:80;
  server_name web.cutcrew.click;
  client_max_body_size 1m;
  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 14400s;
    proxy_send_timeout 14400s;
  }
}

# Landing page (static files from the repo's main/ folder). API and admin
# requests from older app versions are sent on to the website (temporary 302).
server {
  listen 80;
  listen [::]:80;
  server_name cutcrew.click;
  root /var/www/cutcrew-landing;
  index index.html;
  location / { try_files $uri $uri/ /index.html; }
  location /api/ { return 302 https://web.cutcrew.click$request_uri; }
}

server {
  listen 80;
  listen [::]:80;
  server_name ccapi.cutcrew.click;
  client_max_body_size 1m;
  location / {
    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 14400s;
    proxy_send_timeout 14400s;
  }
}

server {
  listen 80;
  listen [::]:80;
  server_name imdbapi.cutcrew.click;
  client_max_body_size 64k;
  location / {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }
}

# Admin panel: static files from the repo's adminpannel/ folder, copied to
# /var/www/cutcrew-admin. Its /api requests go to the backend, which asks for
# the admin token on every admin call.
server {
  listen 80;
  listen [::]:80;
  server_name ccadmin.cutcrew.click;
  root /var/www/cutcrew-admin;
  index index.html;
  client_max_body_size 64k;
  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  location / { try_files $uri $uri/ /index.html; }
  location ~ ^/api/(admin/|logs) {
    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }
  location /api/ { return 404; }
}

# www goes to the bare domain.
server {
  listen 80;
  listen [::]:80;
  server_name www.cutcrew.click;
  return 301 https://cutcrew.click$request_uri;
}
