# Host Nginx for CutCrew. Copy to /etc/nginx/sites-available/cutcrew and link
# into sites-enabled. Certbot adds the HTTPS (443) blocks and redirects.
#   cutcrew.vikrant.sbs -> website (frontend container, which also proxies /api)
#   ccapi.vikrant.sbs   -> backend API and admin pages
#   imdbapi.vikrant.sbs -> IMDb metadata API
# Video is streamed through these proxies: no buffering, long timeouts.

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 80;
  listen [::]:80;
  server_name cutcrew.vikrant.sbs;
  client_max_body_size 1m;
  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 14400s;
    proxy_send_timeout 14400s;
  }
}

server {
  listen 80;
  listen [::]:80;
  server_name ccapi.vikrant.sbs;
  client_max_body_size 1m;
  location / {
    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 14400s;
    proxy_send_timeout 14400s;
  }
}

server {
  listen 80;
  listen [::]:80;
  server_name imdbapi.vikrant.sbs;
  client_max_body_size 64k;
  location / {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }
}
